# Deeptech DZ — مكتبة الفرص الدائمة
# Evergreen resources that are genuinely free and official. Exported to candidates as clusters
# "lib-<id>" so the writer always has valuable non-news material. Each item is posted at most
# once every 60 days. Before writing about an item, the writer opens `url` to confirm it is still
# free and unchanged; if not, skip it. Facts below are deliberately minimal and stable.
# kind: course | tool | security | ai | books

- id: cs50x
  kind: course
  title: CS50x — Harvard's introduction to computer science
  url: https://cs50.harvard.edu/x
  facts: Harvard University's CS50x course is free online. It teaches programming from zero with C, Python, SQL and web development. Students who complete the problem sets and final project can get a free CS50 certificate from the course itself.
  logos: [{name: Harvard, domain: harvard.edu, wiki: Harvard University}]

- id: github-student-pack
  kind: tool
  title: GitHub Student Developer Pack
  url: https://education.github.com/pack
  facts: GitHub Student Developer Pack gives verified students free access to many paid developer tools and services. Students apply with proof of enrollment such as a school email or student card.
  logos: [{name: GitHub, domain: github.com, wiki: GitHub}]

- id: google-ai-studio
  kind: ai
  title: Google AI Studio
  url: https://aistudio.google.com
  facts: Google AI Studio is a free web tool from Google to try and build with Gemini models directly in the browser, with a Google account.
  logos: [{name: Gemini, domain: gemini.google.com, wiki: "Gemini (chatbot)"}]

- id: notebooklm
  kind: ai
  title: Google NotebookLM
  url: https://notebooklm.google.com
  facts: NotebookLM is a free Google tool where you upload your own documents, PDFs or notes, then ask questions about them, get summaries, and generate audio overviews based only on your sources.
  logos: [{name: NotebookLM, domain: notebooklm.google.com, wiki: NotebookLM}]

- id: freecodecamp
  kind: course
  title: freeCodeCamp certifications
  url: https://www.freecodecamp.org/learn
  facts: freeCodeCamp is a non-profit that offers free interactive programming courses and free certifications in web development, Python, data analysis and more.
  logos: [{name: freeCodeCamp, domain: freecodecamp.org, wiki: FreeCodeCamp}]

- id: microsoft-learn
  kind: course
  title: Microsoft Learn
  url: https://learn.microsoft.com/training
  facts: Microsoft Learn offers free self-paced training paths on Azure, AI, Microsoft 365, Power BI and programming, with free practice assessments for Microsoft certifications.
  logos: [{name: Microsoft, domain: microsoft.com, wiki: Microsoft}]

- id: elements-of-ai
  kind: course
  title: Elements of AI
  url: https://www.elementsofai.com
  facts: Elements of AI is a free online course created by the University of Helsinki and MinnaLearn. It explains artificial intelligence for non-programmers and gives a certificate on completion.
  logos: [{name: Elements of AI, domain: elementsofai.com, wiki: Elements of AI}]

- id: kaggle-learn
  kind: course
  title: Kaggle Learn
  url: https://www.kaggle.com/learn
  facts: Kaggle Learn offers free short hands-on courses in Python, machine learning, SQL, data visualization and more, with certificates of completion. Code runs in the browser, nothing to install.
  logos: [{name: Kaggle, domain: kaggle.com, wiki: Kaggle}]

- id: huggingface-learn
  kind: course
  title: Hugging Face courses
  url: https://huggingface.co/learn
  facts: Hugging Face offers free courses on large language models, AI agents, computer vision and more, built around its open-source libraries.
  logos: [{slug: huggingface, name: Hugging Face, domain: huggingface.co, wiki: Hugging Face}]

- id: mit-ocw
  kind: course
  title: MIT OpenCourseWare
  url: https://ocw.mit.edu
  facts: MIT OpenCourseWare publishes materials from thousands of real MIT courses for free, including lecture videos, notes, problem sets and exams.
  logos: [{name: MIT, domain: mit.edu, wiki: Massachusetts Institute of Technology}]

- id: edraak
  kind: course
  title: Edraak — Arabic online courses
  url: https://www.edraak.org
  facts: Edraak is an Arabic massive open online course platform, an initiative of the Queen Rania Foundation, offering courses in Arabic.
  logos: [{name: Edraak, domain: edraak.org, wiki: Edraak}]

- id: coursera-audit
  kind: course
  title: Audit Coursera courses for free
  url: https://www.coursera.org
  facts: Many Coursera courses from universities and companies can be audited for free, which gives access to the course videos and readings. The paid option adds graded assignments and a certificate. Financial aid can be requested on eligible courses.
  logos: [{slug: coursera, name: Coursera, domain: coursera.org, wiki: Coursera}]

- id: haveibeenpwned
  kind: security
  title: Have I Been Pwned
  url: https://haveibeenpwned.com
  facts: Have I Been Pwned is a free website where you enter your email address to see whether it appeared in known data breaches, and which services leaked it.
  logos: [{name: Have I Been Pwned, domain: haveibeenpwned.com, wiki: "Have I Been Pwned?"}]

- id: google-password-checkup
  kind: security
  title: Google Password Checkup
  url: https://passwords.google.com
  facts: Google Password Manager includes Password Checkup, which tells you if any of your saved passwords were exposed in a data breach, reused, or weak.
  logos: [{slug: google, name: Google, domain: google.com, wiki: Google}]

- id: virustotal
  kind: security
  title: VirusTotal
  url: https://www.virustotal.com
  facts: VirusTotal is a free service owned by Google that scans a file or a link with dozens of antivirus engines at once, useful before opening a suspicious file or APK.
  logos: [{name: VirusTotal, domain: virustotal.com, wiki: VirusTotal}]

- id: bitwarden
  kind: security
  title: Bitwarden password manager
  url: https://bitwarden.com
  facts: Bitwarden is an open-source password manager with a free plan that stores unlimited passwords and syncs across unlimited devices.
  logos: [{name: Bitwarden, domain: bitwarden.com, wiki: Bitwarden}]

- id: photopea
  kind: tool
  title: Photopea
  url: https://www.photopea.com
  facts: Photopea is a free online image editor that runs in the browser and opens PSD files, with layers and tools similar to Photoshop.
  logos: [{name: Photopea, domain: photopea.com, wiki: Photopea}]

- id: davinci-resolve
  kind: tool
  title: DaVinci Resolve (free version)
  url: https://www.blackmagicdesign.com/products/davinciresolve
  facts: DaVinci Resolve from Blackmagic Design has a free version for professional video editing, color correction and audio, used in film and television.
  logos: [{name: DaVinci Resolve, domain: blackmagicdesign.com, wiki: DaVinci Resolve}]

- id: blender
  kind: tool
  title: Blender
  url: https://www.blender.org
  facts: Blender is a free and open-source 3D software for modeling, animation, rendering and video editing, used by studios and independent artists.
  logos: [{name: Blender, domain: blender.org, wiki: "Blender (software)"}]

- id: obs-studio
  kind: tool
  title: OBS Studio
  url: https://obsproject.com
  facts: OBS Studio is free open-source software for screen recording and live streaming on Windows, macOS and Linux.
  logos: [{name: OBS Studio, domain: obsproject.com, wiki: OBS Studio}]

- id: libreoffice
  kind: tool
  title: LibreOffice
  url: https://www.libreoffice.org
  facts: LibreOffice is a free open-source office suite with a word processor, spreadsheets and presentations that opens Microsoft Office files.
  logos: [{name: LibreOffice, domain: libreoffice.org, wiki: LibreOffice}]

- id: ollama
  kind: ai
  title: Ollama — run AI models on your own computer
  url: https://ollama.com
  facts: Ollama is a free tool to download and run open AI language models locally on your own computer, without sending your data to the internet once the model is downloaded.
  logos: [{name: Ollama, domain: ollama.com, wiki: Ollama}]

- id: excalidraw
  kind: tool
  title: Excalidraw
  url: https://excalidraw.com
  facts: Excalidraw is a free online whiteboard for hand-drawn style diagrams and sketches, with live collaboration by sharing a link.
  logos: [{name: Excalidraw, domain: excalidraw.com, wiki: Excalidraw}]

- id: open-library
  kind: books
  title: Open Library
  url: https://openlibrary.org
  facts: Open Library, a project of the Internet Archive, lets you search millions of books and borrow digital copies of many of them for free.
  logos: [{name: Internet Archive, domain: archive.org, wiki: Internet Archive}]

- id: project-gutenberg
  kind: books
  title: Project Gutenberg
  url: https://www.gutenberg.org
  facts: Project Gutenberg offers over 70,000 free ebooks, mostly classics in the public domain, to download or read online.
  logos: [{name: Project Gutenberg, domain: gutenberg.org, wiki: Project Gutenberg}]

- id: google-fonts
  kind: tool
  title: Google Fonts
  url: https://fonts.google.com
  facts: Google Fonts is a free library of open-licensed fonts, including many Arabic fonts, usable in designs, websites and commercial projects.
  logos: [{slug: google, name: Google, domain: google.com, wiki: Google}]

- id: canva-education
  kind: tool
  title: Canva for Education
  url: https://www.canva.com/education
  facts: Canva for Education gives eligible primary and secondary school teachers and their students free access to Canva's premium features.
  logos: [{slug: canva, name: Canva, domain: canva.com, wiki: Canva}]

- id: jetbrains-students
  kind: tool
  title: JetBrains free student licenses
  url: https://www.jetbrains.com/community/education
  facts: JetBrains offers free educational licenses for its professional programming tools, such as IntelliJ IDEA and PyCharm, to students and teachers.
  logos: [{name: JetBrains, domain: jetbrains.com, wiki: JetBrains}]

# ---------- تطبيق اليوم (kind: app) — store link + official site ----------
- id: app-localsend
  kind: app
  title: LocalSend
  url: https://localsend.org
  store: https://play.google.com/store/apps/details?id=org.localsend.localsend_app
  facts: LocalSend is a free, open-source app to send files and photos between nearby devices over the local Wi-Fi network, without internet and without an account. It works on Android, iOS, Windows, macOS and Linux.
  logos: [{name: LocalSend, domain: localsend.org, wiki: LocalSend}]

- id: app-snapseed
  kind: app
  title: Snapseed
  url: https://play.google.com/store/apps/details?id=com.niksoftware.snapseed
  facts: Snapseed is a free professional photo editor made by Google, with tools like selective adjustments, healing to remove objects, curves and filters. No ads and no paid features.
  logos: [{name: Snapseed, domain: snapseed.online, wiki: Snapseed}]

- id: app-adobe-scan
  kind: app
  title: Adobe Scan
  url: https://play.google.com/store/apps/details?id=com.adobe.scan.android
  facts: Adobe Scan is a free app from Adobe that turns phone photos of documents, receipts and notes into clean PDF files, with automatic edge detection and text recognition.
  logos: [{slug: adobe, name: Adobe, domain: adobe.com, wiki: Adobe Inc.}]

- id: app-photomath
  kind: app
  title: Photomath
  url: https://play.google.com/store/apps/details?id=com.microblink.photomath
  facts: Photomath, owned by Google, solves math problems from a photo of the exercise, including handwritten ones, and shows step-by-step solutions. Basic solutions are free; some detailed explanations need the paid Plus plan.
  logos: [{name: Photomath, domain: photomath.com, wiki: Photomath}]

- id: app-vlc
  kind: app
  title: VLC for Android
  url: https://play.google.com/store/apps/details?id=org.videolan.vlc
  facts: VLC is a free, open-source media player from the non-profit VideoLAN. It plays almost every video and audio format without extra codecs, supports subtitles, and has no ads.
  logos: [{name: VLC, domain: videolan.org, wiki: VLC media player}]

- id: app-anki
  kind: app
  title: AnkiDroid
  url: https://play.google.com/store/apps/details?id=com.ichi2.anki
  facts: AnkiDroid is the free, open-source Android version of Anki, a flashcard app that uses spaced repetition to show each card right before you are about to forget it. Widely used by medical students and language learners.
  logos: [{name: Anki, domain: apps.ankiweb.net, wiki: Anki (software)}]

- id: app-protonvpn
  kind: app
  title: Proton VPN
  url: https://play.google.com/store/apps/details?id=ch.protonvpn.android
  facts: Proton VPN has a free plan with no data limit and no ads, from Proton, the Swiss company behind Proton Mail. The free plan offers fewer servers and speeds than the paid plans.
  logos: [{name: Proton VPN, domain: protonvpn.com, wiki: Proton VPN}]

- id: app-brave
  kind: app
  title: Brave Browser
  url: https://play.google.com/store/apps/details?id=com.brave.browser
  facts: Brave is a free web browser that blocks ads and trackers by default, including many video ads, which makes pages load faster and use less mobile data.
  logos: [{slug: brave, name: Brave, domain: brave.com, wiki: Brave (web browser)}]

- id: app-signal
  kind: app
  title: Signal
  url: https://play.google.com/store/apps/details?id=org.thoughtcrime.securesms
  facts: Signal is a free messaging app run by a non-profit foundation. Messages and calls are end-to-end encrypted by default, and it collects almost no data about users.
  logos: [{slug: signal, name: Signal, domain: signal.org, wiki: Signal (software)}]

- id: app-obsidian
  kind: app
  title: Obsidian
  url: https://play.google.com/store/apps/details?id=md.obsidian
  facts: Obsidian is a free note-taking app that stores notes as plain Markdown files on your own device and lets you link notes together like a personal wiki.
  logos: [{name: Obsidian, domain: obsidian.md, wiki: Obsidian (software)}]

- id: app-google-translate-offline
  kind: app
  title: Google Translate offline
  url: https://play.google.com/store/apps/details?id=com.google.android.apps.translate
  facts: Google Translate can download languages, including Arabic, French and English, to translate text without an internet connection, and can translate text from the camera.
  logos: [{slug: google, name: Google Translate, domain: translate.google.com, wiki: Google Translate}]

- id: app-aegis
  kind: app
  title: Aegis Authenticator
  url: https://play.google.com/store/apps/details?id=com.beemdevelopment.aegis
  facts: Aegis is a free, open-source Android app for two-factor authentication codes. It stores codes in an encrypted vault and supports encrypted backups, so you do not lose access if you change phones.
  logos: [{name: Aegis, domain: getaegis.app, wiki: Aegis Authenticator}]

- id: app-google-lens
  kind: app
  title: Google Lens
  url: https://play.google.com/store/apps/details?id=com.google.ar.lens
  facts: Google Lens uses the phone camera to translate text in real time, copy text from paper, identify plants and products, and help solve homework, for free.
  logos: [{slug: google, name: Google Lens, domain: lens.google, wiki: Google Lens}]

- id: app-perplexity
  kind: app
  title: Perplexity
  url: https://play.google.com/store/apps/details?id=ai.perplexity.app.android
  facts: Perplexity is an AI search app that answers questions in full sentences and lists the web sources it used, so you can check them. It has a free plan.
  logos: [{slug: perplexity, name: Perplexity, domain: perplexity.ai, wiki: Perplexity AI}]

# ---------- موقع اليوم (kind: site) ----------
- id: site-ilovepdf
  kind: site
  title: iLovePDF
  url: https://www.ilovepdf.com
  facts: iLovePDF is a website with free tools to merge, split, compress and convert PDF files to and from Word, Excel, PowerPoint and images, directly in the browser.
  logos: [{name: iLovePDF, domain: ilovepdf.com, wiki: iLovePDF}]

- id: site-squoosh
  kind: site
  title: Squoosh
  url: https://squoosh.app
  facts: Squoosh is a free, open-source image compressor made by Google. It shrinks image file size in the browser, shows a before-and-after comparison, and the images are not uploaded to a server.
  logos: [{name: Squoosh, domain: squoosh.app, wiki: Squoosh}]

- id: site-removebg
  kind: site
  title: remove.bg
  url: https://www.remove.bg
  facts: remove.bg removes the background from a photo automatically in a few seconds. The free version gives a preview-resolution image; full resolution is paid.
  logos: [{name: remove.bg, domain: remove.bg, wiki: Remove.bg}]

- id: site-pexels
  kind: site
  title: Pexels
  url: https://www.pexels.com
  facts: Pexels offers free high-quality stock photos and videos that can be used for free, including in commercial projects, without asking permission.
  logos: [{name: Pexels, domain: pexels.com, wiki: Pexels}]

- id: site-deepl
  kind: site
  title: DeepL Translator
  url: https://www.deepl.com/translator
  facts: DeepL is an online translator known for natural-sounding translations. It supports Arabic, French and English and can translate whole documents; the free version has usage limits.
  logos: [{name: DeepL, domain: deepl.com, wiki: DeepL Translator}]

- id: site-desmos
  kind: site
  title: Desmos
  url: https://www.desmos.com/calculator
  facts: Desmos is a free online graphing calculator. You type a function and see its graph instantly, with sliders to change parameters; useful for math students and teachers.
  logos: [{name: Desmos, domain: desmos.com, wiki: Desmos}]

- id: site-wolframalpha
  kind: site
  title: Wolfram|Alpha
  url: https://www.wolframalpha.com
  facts: Wolfram|Alpha is a computational knowledge engine that solves math, physics and chemistry questions, converts units and answers factual questions with computed results. The basic version is free.
  logos: [{name: Wolfram Alpha, domain: wolframalpha.com, wiki: Wolfram Alpha}]

- id: site-diagrams
  kind: site
  title: draw.io (diagrams.net)
  url: https://app.diagrams.net
  facts: draw.io is a free online diagram editor for flowcharts, network diagrams and UML, which can save files to your computer or Google Drive, without an account.
  logos: [{name: draw.io, domain: drawio.com, wiki: Diagrams.net}]

- id: site-overleaf
  kind: site
  title: Overleaf
  url: https://www.overleaf.com
  facts: Overleaf is an online LaTeX editor used to write scientific reports, theses and research papers, with ready templates and a free plan.
  logos: [{name: Overleaf, domain: overleaf.com, wiki: Overleaf}]

- id: site-zotero
  kind: site
  title: Zotero
  url: https://www.zotero.org
  facts: Zotero is a free, open-source tool to collect, organize and cite research sources, and to generate bibliographies automatically in many citation styles.
  logos: [{name: Zotero, domain: zotero.org, wiki: Zotero}]

- id: site-wayback
  kind: site
  title: Wayback Machine
  url: https://web.archive.org
  facts: The Wayback Machine from the Internet Archive stores copies of web pages over time, so you can see old versions of a site or recover a page that was deleted.
  logos: [{name: Internet Archive, domain: archive.org, wiki: Wayback Machine}]

- id: site-downdetector
  kind: site
  title: Downdetector
  url: https://downdetector.com
  facts: Downdetector shows in real time whether a service such as WhatsApp, YouTube or Instagram is down for many users, based on reports, so you know if the problem is on your side or not.
  logos: [{name: Downdetector, domain: downdetector.com, wiki: Downdetector}]

- id: site-monkeytype
  kind: site
  title: Monkeytype
  url: https://monkeytype.com
  facts: Monkeytype is a free, open-source typing test website to measure and improve typing speed and accuracy, with many languages and modes.
  logos: [{name: Monkeytype, domain: monkeytype.com, wiki: Monkeytype}]

- id: site-coolors
  kind: site
  title: Coolors
  url: https://coolors.co
  facts: Coolors generates matching color palettes with one key press, and lets you lock colors you like and export palettes for design projects. The basic generator is free.
  logos: [{name: Coolors, domain: coolors.co, wiki: Coolors}]

- id: site-arts-culture
  kind: site
  title: Google Arts & Culture
  url: https://artsandculture.google.com
  facts: Google Arts & Culture is a free platform from Google with high-resolution artworks and virtual tours of museums and historic sites from around the world.
  logos: [{slug: google, name: Google Arts & Culture, domain: artsandculture.google.com, wiki: Google Arts & Culture}]
