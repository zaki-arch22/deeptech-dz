  - {name: Opportunities for Africans, url: https://www.opportunitiesforafricans.com/feed/, trust: 1, verify: true}
  - {name: Scholarship Positions,     url: https://scholarship-positions.com/feed/,       trust: 1, verify: true}
  - {name: DAAD News,                 url: https://www.daad.de/en/rss/news/,              trust: 3, verify: true}

visa:
