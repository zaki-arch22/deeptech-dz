  - {name: New Atlas,          url: https://newatlas.com/index.rss,                    trust: 2, verify: true}
  - {name: Space.com,          url: https://www.space.com/feeds/all,                   trust: 2, verify: true}
  - {name: NASA,               url: https://www.nasa.gov/news-release/feed/,           trust: 3, verify: true}

study:
