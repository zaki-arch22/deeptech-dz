  - {name: VisaGuide News,            url: https://visaguide.world/news/feed/,            trust: 2, verify: true}
  - {name: CIC News (Canada),         url: https://www.cicnews.com/feed,                  trust: 2, verify: true}

trends:
  - {name: Google Trends DZ,          url: "https://trends.google.com/trending/rss?geo=DZ", trust: 1, verify: true}
  - {name: Google Trends FR,          url: "https://trends.google.com/trending/rss?geo=FR", trust: 1, verify: true}
  - {name: Google Trends US,          url: "https://trends.google.com/trending/rss?geo=US", trust: 1, verify: true}

